name: Build InstaDesk IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          swift --version

      - name: Build unsigned IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify output
        run: |
          ls -la build/
          unzip -l build/InstaDesk.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InstaDesk-ipa
          path: build/InstaDesk.ipa
          retention-days: 90
